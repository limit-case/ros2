# Profile: RealSense D435. Tuned ONLY on ClearGrasp D435 val (scripts/tune_val.py; every configuration is in
# results/tune_val.csv, the winner in results/selected.json). Selection rule, fixed before any test run:
# maximize wrong removed subject to correct lost <= 5%. Measured at 1280x720 with downsample 3.
/**:
  ros__parameters:
    sensor_profile: realsense_d435
    downsample: 3
    min_basin_depth_m: 0.01
    min_basin_depth_rel: 0.015
    min_region_area_px: 150
    max_range_m: 4.0
    treat_invalid_as_wall: false
    boundary_verify: true          # strict: holes alone never flag
    min_nearer_boundary_frac: 0.1
    flag_hole_only: false
    use_rgb: false
    specular_v_thresh: 240
    specular_s_thresh: 40
    confidence_threshold: 0.3
    publish_cloud: true
    cloud_stride: 2
