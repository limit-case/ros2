# Defaults from readthis.md section 4. Defaults are re-tuned on ClearGrasp D435 val (section 8);
# the tuned values and the grid are recorded in results/.
/**:
  ros__parameters:
    sensor_profile: default
    downsample: 2
    min_basin_depth_m: 0.02
    min_basin_depth_rel: 0.03
    min_region_area_px: 150
    max_range_m: 4.0
    treat_invalid_as_wall: false   # rev. 2: false = holes impassable; true = BFS wall option
    boundary_verify: false         # variant (c), see docs/DECISIONS.md
    min_nearer_boundary_frac: 0.1
    flag_hole_only: false
    use_rgb: false
    specular_v_thresh: 240
    specular_s_thresh: 40
    confidence_threshold: 0.5
    publish_cloud: true
    cloud_stride: 2
