name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Each ROS 2 distro is only supported on its own Ubuntu release.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros: jazzy
            os: ubuntu-24.04
          - ros: humble
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros }}
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: limit_case_ros2
          target-ros2-distro: ${{ matrix.ros }}
          # colcon build + colcon test (gtests, launch test, ament_lint_auto linters) + test-result
