name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # ROS comes preinstalled in the official image, so nothing installs ROS on the runner.
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.ros }}-ros-base
    strategy:
      fail-fast: false
      matrix:
        ros: [jazzy, humble]
    steps:
      - uses: actions/checkout@v4

      # The image deletes downloaded .debs after every apt call. Keep them so they can be cached.
      - name: Keep apt downloads for caching
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/99keep-cache
          apt-get update
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ matrix.ros }}-${{ hashFiles('package.xml') }}
          restore-keys: apt-${{ matrix.ros }}-

      # No required-ros-distributions: ROS is already in the container, this only sets up colcon/rosdep.
      - uses: ros-tooling/setup-ros@v0.7
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: limit_case_ros2
          target-ros2-distro: ${{ matrix.ros }}
          import-token: ${{ secrets.GITHUB_TOKEN }}
          rosdep-skip-keys: depth_image_proc rviz2 rosbag2_storage_mcap
          # colcon build + colcon test (gtests, launch test, ament_lint_auto linters) + test-result
